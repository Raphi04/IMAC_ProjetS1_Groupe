<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MariDex - Home</title>

    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./src/styles/home.css" />
    <link rel="stylesheet" href="./src/styles/pokemon-card.css" />
    <link rel="icon" type="image/x-icon" href="./src/images/logo.png" />
  </head>

  <body>
    <maridex-header
      images-path="./src/images/"
      pages-path="./"
    ></maridex-header>

    <main>
      <section id="introduction">
        <h1>SEARCH ON MARIDEX</h1>
        <p>Quickly find all informations about your favorites Pokémons !</p>
      </section>

      <form name="searchPokemon">
        <label for="pokemon-number">Pokémon's Number</label>
        <div>
          <input
            name="pokemonId"
            type="number"
            id="pokemon-number"
            min="1"
            max="1025"
            placeholder="Exemple : 650"
          />
          <button type="submit">
            <img src="./src/images/search-icon.png" alt="Recherche" />
          </button>
        </div>
      </form>

      <section id="random-pokemon-container">
        <h2>Random Pokémons</h2>

        <div id="random-pokemon-loading">
          <img src="../src/images/loading.png" alt=""/>
        </div>
        
        <div id="pokemon-grid" class="hidden"></div>
      </section>
    </main>

    <maridex-footer
      images-path="./src/images/"
      pages-path="./"
    ></maridex-footer>

    <script
      type="module"
      src="./src/scripts/components/maridex-header.js"
    ></script>

    <script
      type="module"
      src="./src/scripts/components/maridex-footer.js"
    ></script>

    <script
      type="module"
      src="./src/scripts/components/pokemon-card.js"
    ></script>

    <script
      type="module"
      src="./src/scripts/get-pokemon-for-home.js"></script>
    </script>
  </body>
</html>
