<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./src/styles/home.css" />
    <link rel="stylesheet" href="./src/styles/pokemon_card.css" />
    <title>MariDex - Home</title>
    <link rel="icon" type="image/x-icon" href="./src/images/logo.png" />
  </head>
  <body>
    <maridex-header
      images-path="./src/images/"
      pages-path="./"
    ></maridex-header>

    <main>
      <section id="introduction">
        <h2>SEARCH ON MARIDEX</h2>
        <p>Quickly find all informations about your favorites Pokémons !</p>
      </section>

      <form name="search_pokemon">
        <label for="pokemon-number">Pokémon's Number</label>
        <div>
          <input
            name="pokemon_id"
            type="number"
            id="pokemon-number"
            min="1"
            max="1025"
            placeholder="Exemple : 650"
          />
          <button type="submit">
            <img src="./src/images/search_icon.png" alt="" />
          </button>
        </div>
      </form>

      <section id="random-pokemon-container">
        <h2>Random Pokémons</h2>
        <div id="pokemon-grid"></div>
      </section>
    </main>

    <maridex-footer
      images-path="./src/images/"
      pages-path="./"
    ></maridex-footer>

    <script
      type="module"
      src="./src/scripts/components/MariDexHeader.js"
    ></script>

    <script
      type="module"
      src="./src/scripts/components/MariDexFooter.js"
    ></script>

    <script
      type="module"
      src="./src/scripts/components/PokemonCard.js"
    ></script>

    <script
      type="module"
      src="./src/scripts/getPokemonForHome.js"></script>
    </script>
  </body>
</html>
