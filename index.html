<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./src/styles/home.css" />
    <title>MariDex - Home</title>
    <link rel="icon" type="image/x-icon" href="./src/images/logo.png" />
  </head>
  <body>
    <maridex-header
      images-path="./src/images/"
      pages-path="./"
    ></maridex-header>

    <main>
      <section id="introduction">
        <h2>SEARCH ON MARIDEX</h2>
        <p>Quickly find all informations about your favorites Pokémons !</p>
      </section>

      <form>
        <label for="pokemon-number">Pokémon's Number</label>
        <div>
          <input
            type="number"
            id="pokemon-number"
            min="1"
            max="1025"
            placeholder="Exemple : 650"
          />
          <button type="submit">
            <img src="./src/images/search_icon.png" alt="" />
          </button>
        </div>
      </form>
    </main>

    <footer>
      <div id="contenu-footer">
        <div id="haut-du-footer">
          <div id="footer-nav">
            <h1>Plan du site</h1>
            <ul>
              <li><a href="index.html">Accueil</a></li>
              <li><a href="pages/velos.html">A propos</a></li>
              <li><a href="pages/itineraires.html">Pokédex</a></li>
            </ul>
          </div>

          <p>
            Ce site a été créé à l'occasion d'un projet de premier semestre de
            la <b>formation IMAC</b>.
          </p>

          <img src="./src/images/logo.png" alt="Logo" />
        </div>

        <p>© Tous droits réservés - MariDex 2025</p>
      </div>
    </footer>
  </body>
</html>
